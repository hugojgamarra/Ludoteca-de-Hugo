<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Corregir index - Ludoteca de Hugo</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:20px;line-height:1.5}
button,input{font:inherit;padding:12px}
button{cursor:pointer}
.ok{color:green;font-weight:700}.err{color:#b00020;font-weight:700}
</style>
<h1>Corregir index.html — Ludoteca de Hugo</h1>
<p>Seleccioná el <b>index.html actual</b> de tu repositorio. Este archivo agregará el clic en las tarjetas de la pestaña <b>Juegos</b> y descargará un nuevo <b>index.html</b> corregido.</p>
<input type="file" id="file" accept=".html,text/html">
<button id="go">Crear index.html corregido</button>
<p id="msg"></p>
<script>
const msg=document.getElementById('msg');
document.getElementById('go').onclick=async()=>{
  const f=document.getElementById('file').files[0];
  if(!f){msg.className='err';msg.textContent='Primero seleccioná tu index.html actual.';return}
  let c=await f.text();
  const oldCard='v20CollectionGrid.innerHTML=arr.map(g=>`<div class="v20-game"><img src="${g.img}"><div style="flex:1"><div class="name">${escapeHtml(g.title)}</div><div class="meta">${escapeHtml(g.players)} · ${escapeHtml(g.duration)} · ${escapeHtml(g.age)}</div></div></div>`).join(\\'\\');';
  const newCard='v20CollectionGrid.innerHTML=arr.map(g=>`<div class="v20-game" data-game-id="${g.id}"><img src="${g.img}"><div style="flex:1"><div class="name">${escapeHtml(g.title)}</div><div class="meta">${escapeHtml(g.players)} · ${escapeHtml(g.duration)} · ${escapeHtml(g.age)}</div></div></div>`).join(\\'\\');';
  if(!c.includes(oldCard)){msg.className='err';msg.textContent='No encontré el bloque esperado. Verificá que seleccionaste el index.html actual de V21.1.';return}
  c=c.replace(oldCard,newCard);
  const anchor='}\\nfunction goto(page){';
  const listener=`}
v20CollectionGrid.addEventListener('click',e=>{
 const card=e.target.closest('.v20-game');
 if(!card)return;
 const g=gameById(card.dataset.gameId);
 if(g)openGame(g);
});
function goto(page){`;
  if(!c.includes(anchor)){msg.className='err';msg.textContent='No encontré el punto de inserción del evento de clic.';return}
  c=c.replace(anchor,listener);
  const blob=new Blob([c],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='index.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  msg.className='ok';msg.textContent='Listo. Se descargó index.html corregido.';
};
</script>
</html>
