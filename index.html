<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#171719;--muted:#71717a;--line:#e5e5e7;--accent:#202124;--chip:#eeeef0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
body.dark{--bg:#0f1012;--card:#1a1b1f;--text:#f5f5f7;--muted:#a8abb2;--line:#303238;--accent:#f5f5f7;--chip:#282a2f}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{max-width:1400px;margin:auto;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:25px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:9px 11px;font-size:17px}
.controls{max-width:1400px;margin:auto;padding:0 16px 13px;display:grid;grid-template-columns:1fr auto;gap:8px}
input,select,button{font:inherit}.search,select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:11px 12px}
.tabs{max-width:1400px;margin:auto;padding:0 16px 12px;display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap;border:0;background:var(--chip);color:var(--text);padding:8px 12px;border-radius:999px}.tab.active{background:var(--accent);color:var(--bg)}
main{max-width:1400px;margin:auto;padding:14px 16px 90px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 2px 10px #0000000a;cursor:pointer}.pic{aspect-ratio:1;background:white}.pic img{width:100%;height:100%;object-fit:contain;display:block}.info{padding:11px 12px 13px;border-top:1px solid var(--line)}.id{font-size:10px;color:var(--muted)}.title{font-weight:700;margin:2px 0 7px}.facts{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:10px;background:var(--chip);padding:4px 7px;border-radius:999px;color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:50px 10px}.actions{position:static;transform:none;display:flex;gap:10px;max-width:1100px;margin:12px auto 4px;padding:0 18px}.primary{border:0;border-radius:999px;padding:12px 17px;background:#171719;color:white;box-shadow:0 5px 20px #0003}.secondary{border:1px solid var(--line);border-radius:999px;padding:12px 17px;background:var(--card);color:var(--text);box-shadow:0 5px 20px #0002}
dialog{width:min(92vw,520px);border:1px solid var(--line);border-radius:22px;padding:0;background:var(--card);color:var(--text);box-shadow:0 20px 70px #0006}dialog::backdrop{background:#0008}.modalpic{background:white;border-radius:22px 22px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center}.modalpic img{width:100%;height:auto;max-height:55vh;object-fit:contain;display:block}.modalbody{padding:16px}.modalbody h2{margin:0 0 5px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.detail{background:var(--chip);border-radius:12px;padding:10px}.detail small{display:block;color:var(--muted)}.close{width:100%;border:0;border-radius:13px;padding:11px;background:var(--accent);color:var(--bg)}
.reco{padding:16px}.reco h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reco button.go{width:100%;margin-top:12px;border:0;border-radius:13px;padding:12px;background:var(--accent);color:var(--bg)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}main{padding:10px}.top,.controls,.tabs{padding-left:10px;padding-right:10px}.title{font-size:13px}.facts .chip:nth-child(n+3){display:none}.controls{grid-template-columns:1fr 105px}.actions{width:auto;padding:0 10px;margin:10px auto 2px}.actions button{flex:1}.formgrid{grid-template-columns:1fr}}

.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{display:block;width:92px;height:72px;object-fit:contain;border-radius:14px;transition:.2s ease}
.brand .sub{max-width:190px;line-height:1.25}
body.dark .brand-logo{background:#fff;padding:4px;box-shadow:0 0 0 1px #34363c,0 3px 12px #0005}
@media(max-width:600px){
  .brand-logo{width:78px;height:62px}
  .brand .sub{font-size:11px;max-width:150px}
}

/* V5 header: definitive transparent logo */
.top{position:relative;justify-content:center;min-height:150px;padding-top:10px;padding-bottom:8px}
.brand{width:100%;justify-content:center}
.brand-logo{width:min(330px,68vw);height:132px;object-fit:contain;border-radius:0;background:transparent!important;padding:0!important;box-shadow:none!important}
.top>.iconbtn{position:absolute;right:16px;top:18px}
body.dark .brand-logo{background:transparent!important;padding:0!important;box-shadow:none!important}
@media(max-width:600px){
 .top{min-height:132px;padding-top:6px;padding-bottom:4px}
 .brand-logo{width:min(300px,72vw);height:118px}
 .top>.iconbtn{right:10px;top:12px}
}

@media(max-width:600px){
  #detail{
    width:calc(100vw - 24px);
    max-height:calc(100dvh - 24px);
    margin:auto;
    overflow-y:auto;
  }
  #detail .modalpic{
    width:100%;
    height:auto;
    aspect-ratio:auto;
  }
  #detail .modalpic img{
    width:100%;
    height:auto;
    max-height:none;
    object-fit:contain;
  }
}

.recohint{color:var(--muted);margin-top:-4px}.recoresults{margin-top:16px;display:grid;gap:10px}
.recopick{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;color:var(--text)}
.recopick img{width:74px;height:74px;object-fit:contain;background:#fff;border-radius:9px}
.recopick b{display:block;font-size:15px}.recopick small{color:var(--muted);line-height:1.35;display:block;margin-top:3px}
.recolabel{margin-top:16px;font-weight:800}.recoempty{color:var(--muted);margin-top:16px}

html.modal-open, body.modal-open{
  overflow:hidden !important;
  overscroll-behavior:none !important;
  touch-action:none;
}
dialog[open]{
  overscroll-behavior:contain;
  touch-action:pan-y;
}

.recoopt{display:flex;gap:9px;align-items:center;margin:12px 2px 4px;color:var(--muted);font-size:14px}
.recoopt input{width:18px;height:18px}
.recoscore{display:inline-block;margin-top:5px;font-size:12px;font-weight:800;color:var(--text)}

   box.innerHTML=`<strong>🎲 ${n} ${n===1?"partida jugada":"partidas jugadas"}</strong>
     <button type="button" data-minus aria-label="Restar partida">−</button>
     <button type="button" data-plus aria-label="Sumar partida">+</button>
     <div class="play-last">${last?`Última partida: ${last}`:"Aún no registraste partidas"}</div>`;
   box.querySelector("[data-minus]").onclick=()=>{
     const o=getCounts(); o[g.id]=Math.max(0,(o[g.id]||0)-1); saveCounts(o); renderCounter();
   };
   box.querySelector("[data-plus]").onclick=()=>{
     const o=getCounts(); o[g.id]=(o[g.id]||0)+1; saveCounts(o);
     const pl=getPlayed(); pl[g.id]=Date.now(); savePlayed(pl); renderCounter();
   };
 }

 // Observe each detail opening.
 new MutationObserver(()=>{if(!detail.querySelector(".play-counter"))setTimeout(renderCounter,0)}).observe(detail,{childList:true,subtree:true});

 // Existing "Jugamos hoy" now increments the count once per tap.
 detail.addEventListener("click",e=>{
   const btn=e.target.closest("[data-play]");
   if(!btn)return;
   const g=gameFromDetail(); if(!g)return;
   const o=getCounts(); o[g.id]=(o[g.id]||0)+1; saveCounts(o);
   setTimeout(renderCounter,0);
 },true);
})();
</script>

<script>
(()=>{
 const HKEY="ludoteca-play-history-v1", CKEY="ludoteca-play-count-v1", PKEY="ludoteca-played-v1", FKEY="ludoteca-favorites-v1";
 const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}};
 const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
 const history=()=>read(HKEY,{});
 const counts=()=>read(CKEY,{});
 const titleOf=id=>games.find(g=>g.id===id)?.title||id;

 function addHistory(id,ts=Date.now()){
   let h=history(); (h[id]||(h[id]=[])).push(ts); write(HKEY,h);
 }
 function removeLatestHistory(id){
   let h=history(); if(h[id]?.length){h[id].pop(); if(!h[id].length)delete h[id]; write(HKEY,h)}
 }
 function syncLastPlayed(id){
   let h=history(), p=read(PKEY,{});
   if(h[id]?.length)p[id]=h[id][h[id].length-1]; else delete p[id];
   write(PKEY,p);
 }

 // Record history for existing play controls.
 const detail=document.querySelector("#detail");
 if(detail){
   detail.addEventListener("click",e=>{
     const g=games.find(x=>(document.querySelector("#detailContent")?.textContent||"").includes(x.title));
     if(!g)return;
     if(e.target.closest("[data-play]")) addHistory(g.id);
     if(e.target.closest(".play-counter [data-plus]")) addHistory(g.id);
     if(e.target.closest(".play-counter [data-minus]")){removeLatestHistory(g.id);syncLastPlayed(g.id)}
   },false);

   new MutationObserver(()=>{
     const c=document.querySelector("#detailContent");
     if(!c || c.querySelector(".history-block"))return;
     const g=games.find(x=>(c.textContent||"").includes(x.title));
     if(!g)return;
     const h=(history()[g.id]||[]).slice().reverse().slice(0,8);
     const block=document.createElement("div"); block.className="history-block";
     block.innerHTML=`<h4>Historial de partidas</h4><div class="history-list">${h.length?h.map((t,i)=>`${i+1}. ${new Date(t).toLocaleDateString("es")} · ${new Date(t).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}`).join("<br>"):"Todavía no hay partidas registradas."}</div>`;
     c.appendChild(block);
   }).observe(detail,{childList:true,subtree:true});
 }

 // Never-played filter.
 const neverTab=[...document.querySelectorAll(".tab")].find(b=>b.dataset.style==="NuncaJugados");
 neverTab?.addEventListener("click",()=>setTimeout(()=>{
   const c=counts();
   document.querySelectorAll(".card").forEach(card=>card.style.display=((c[card.dataset.id]||0)===0)?"":"none");
   document.querySelector("#catalogCount")?.dispatchEvent(new Event("v8refresh"));
   updateStats();
 },0));

 function stats(){
   const c=counts(), totalPlays=Object.values(c).reduce((a,n)=>a+(Number(n)||0),0);
   const playedIds=games.filter(g=>(c[g.id]||0)>0);
   const never=games.length-playedIds.length;
   let most=null;
   playedIds.forEach(g=>{if(!most||(c[g.id]||0)>(c[most.id]||0))most=g});
   return {totalPlays,played:playedIds.length,never,most,mostN:most?(c[most.id]||0):0};
 }
 function updateStats(){
   const s=stats(), box=document.querySelector("#statsPanel"); if(!box)return;
   box.innerHTML=`<div class="statbox"><b>${games.length}</b><span>juegos</span></div>
   <div class="statbox"><b>${s.totalPlays}</b><span>partidas registradas</span></div>
   <div class="statbox"><b>${s.played}</b><span>juegos jugados</span></div>
   <div class="statbox"><b>${s.never}</b><span>nunca jugados</span></div>
   <div class="statbox"><b>${s.most?s.most.title:"—"}</b><span>${s.most?`más jugado · ${s.mostN} partidas`:"más jugado"}</span></div>`;
 }
 document.querySelector("#toggleStats")?.addEventListener("click",()=>{
   const p=document.querySelector("#statsPanel"); p.hidden=!p.hidden; updateStats();
 });

 // Backup/export of user-created local data only.
 document.querySelector("#exportData")?.addEventListener("click",()=>{
   const data={
     app:"Ludoteca de Hugo",version:1,exportedAt:new Date().toISOString(),
     favorites:read(FKEY,[]),playCounts:counts(),lastPlayed:read(PKEY,{}),playHistory:history()
   };
   const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
   const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
   a.download=`Ludoteca_de_Hugo_backup_${new Date().toISOString().slice(0,10)}.json`;
   document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 });

 const input=document.querySelector("#importFile");
 document.querySelector("#importData")?.addEventListener("click",()=>input?.click());
 input?.addEventListener("change",async()=>{
   const f=input.files?.[0]; if(!f)return;
   try{
     const d=JSON.parse(await f.text());
     if(d.app!=="Ludoteca de Hugo")throw new Error("Archivo no reconocido");
     if(Array.isArray(d.favorites))write(FKEY,d.favorites);
     if(d.playCounts&&typeof d.playCounts==="object")write(CKEY,d.playCounts);
     if(d.lastPlayed&&typeof d.lastPlayed==="object")write(PKEY,d.lastPlayed);
     if(d.playHistory&&typeof d.playHistory==="object")write(HKEY,d.playHistory);
     updateStats(); alert("Datos importados correctamente.");
   }catch(e){alert("No se pudo importar el archivo de respaldo.");}
   input.value="";
 });

 updateStats();
})();
</script>

 const diffRank={"Muy ligera":1,"Ligera":2,"Ligera-media":3,"Media":4};
 const experienceMatch=(g,x)=>{
   if(!x)return 1; const text=(g.style+" "+g.mechanics).toLowerCase();
   const map={
    "Party":["party","velocidad","reflejos","humor","música","creatividad","interacción directa","eliminación"],
    "Familiar":["familiar","memoria","cartas","dados","patrones","colección"],

 };
 btn.addEventListener("click",ev=>{

   const p=+document.querySelector("#rp").value||0,t=+document.querySelector("#rt").value||0,d=document.querySelector("#rd").value,x=document.querySelector("#rx").value,includeExp=document.querySelector("#rex").checked;
   const last=read("ludoteca-played-v1",{}), counts=read("ludoteca-play-count-v1",{}), now=Date.now();
   let ranked=games.filter(g=>(includeExp||!expansionIds.has(g.id))&&supports(g,p)&&(!t||t===999||minutes(g)<=t)).map(g=>{

     if(!expansionIds.has(g.id))score+=1;
     const lp=last[g.id]||0, n=counts[g.id]||0, age=lp?now-lp:Infinity;
     if(!lp){score+=3;reasons.push("todavía no jugado")}
     else if(age>=60*DAY){score+=2;reasons.push("hace tiempo que no sale")}
     else if(age<7*DAY){score-=8;reasons.push("jugado recientemente")}
     else if(age<30*DAY){score-=3;}
     score+=Math.max(0,2-Math.min(2,n));
     return {g,score,reasons};
   }).filter(o=>(!x||experienceMatch(o.g,x)>0)&&(!d||Math.abs((diffRank[o.g.difficulty]||2)-(diffRank[d]||2))<=1))
     .sort((a,b)=>b.score-a.score||((counts[a.g.id]||0)-(counts[b.g.id]||0))||minutes(a.g)-minutes(b.g)||a.g.title.localeCompare(b.g.title)).slice(0,3);
   const box=document.querySelector("#recoResults");
   if(!ranked.length){box.innerHTML='<div class="recoempty">No encontré una coincidencia suficientemente buena. Prueba ampliando el tiempo o dejando libre un criterio.</div>';return}
   box.innerHTML='<div class="recolabel">Mis recomendaciones <small style="display:block;font-weight:500;margin-top:3px">Se priorizan juegos poco jugados y se penalizan los jugados en los últimos 7 días.</small></div><div class="recoresults">'+ranked.map((o,i)=>`<button class="recopick" data-id="${o.g.id}"><img src="${o.g.img}"><span><b>${i+1}. ${o.g.title}</b><small>${o.g.players} jugadores · ${o.g.duration} · ${o.g.difficulty}</small><small>${o.reasons.slice(0,3).join(" · ")||o.g.style}</small></span></button>`).join("")+'</div>';
   box.querySelectorAll(".recopick").forEach(b=>b.onclick=()=>{document.querySelector("#reco").close();setTimeout(()=>openGame(games.find(g=>g.id===b.dataset.id)),0)});
 },true);
})();
</script>

<script id="v12-integrity-patch">
(()=>{
  // Normalización de casos especiales. El conteo de partidas lo gestiona un único módulo.
  const playerRules={J011:[2,4]};
  supports=function(g,n){
    if(!n)return true;
    if(playerRules[g.id])return playerRules[g.id].includes(n);
    const str=String(g.players||"");
    const nums=(str.match(/\d+/g)||[]).map(Number);
    if(!nums.length)return true;
    if(str.includes("–")||str.includes("-"))return n>=nums[0]&&n<=nums[nums.length-1];
    if(str.includes("+"))return n>=nums[0];
    return nums.includes(n);
  };
  minutes=function(g){
    const str=String(g.duration||"");
    if(/no especificado|variable|^—$/i.test(str.trim()))return 999;
    const m=(str.match(/\d+/g)||[]).map(Number);
    return m.length?Math.max(...m):999;
  };
})();
</script>
