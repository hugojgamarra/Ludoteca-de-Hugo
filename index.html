.empty{text-align:center;color:var(--muted);padding:50px 10px}.actions{position:static;transform:none;display:flex;gap:10px;max-width:1100px;margin:12px auto 4px;padding:0 18px}.primary{border:0;border-radius:999px;padding:12px 17px;background:#171719;color:white;box-shadow:0 5px 20px #0003}.secondary{border:1px solid var(--line);border-radius:999px;padding:12px 17px;background:var(--card);color:var(--text);box-shadow:0 5px 20px #0002}

.reco{padding:16px}.reco h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reco button.go{width:100%;margin-top:12px;border:0;border-radius:13px;padding:12px;background:var(--accent);color:var(--bg)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}main{padding:10px}.top,.controls,.tabs{padding-left:10px;padding-right:10px}.title{font-size:13px}.facts .chip:nth-child(n+3){display:none}.controls{grid-template-columns:1fr 105px}.actions{width:auto;padding:0 10px;margin:10px auto 2px}.actions button{flex:1}.formgrid{grid-template-columns:1fr}}

<script>
(()=>{
 const COUNT_KEY="ludoteca-play-count-v1";
 const PLAY_KEY="ludoteca-played-v1";
 const getCounts=()=>JSON.parse(localStorage.getItem(COUNT_KEY)||"{}");
 const saveCounts=o=>localStorage.setItem(COUNT_KEY,JSON.stringify(o));
 const getPlayed=()=>JSON.parse(localStorage.getItem(PLAY_KEY)||"{}");
 const savePlayed=o=>localStorage.setItem(PLAY_KEY,JSON.stringify(o));
 const detail=document.querySelector("#detail");
 if(!detail)return;

 function gameFromDetail(){
   const c=document.querySelector("#detailContent");
   if(!c)return null;
   return games.find(g=>(c.textContent||"").includes(g.title))||null;
 }
 function renderCounter(){
   const c=document.querySelector("#detailContent"), g=gameFromDetail();
   if(!c||!g)return;
   let box=c.querySelector(".play-counter");
   if(!box){
     box=document.createElement("div");
     box.className="play-counter";
     c.appendChild(box);
   }
   const counts=getCounts(), played=getPlayed(), n=counts[g.id]||0;
   const last=played[g.id] ? new Date(played[g.id]).toLocaleDateString("es") : "";
   box.innerHTML=`<strong>🎲 ${n} ${n===1?"partida jugada":"partidas jugadas"}</strong>
     <button type="button" data-minus aria-label="Restar partida">−</button>
     <button type="button" data-plus aria-label="Sumar partida">+</button>
     <div class="play-last">${last?`Última partida: ${last}`:"Aún no registraste partidas"}</div>`;
   box.querySelector("[data-minus]").onclick=()=>{
     const o=getCounts(); o[g.id]=Math.max(0,(o[g.id]||0)-1); saveCounts(o); renderCounter();
   };
   box.querySelector("[data-plus]").onclick=()=>{
     const o=getCounts(); o[g.id]=(o[g.id]||0)+1; saveCounts(o);
     const pl=getPlayed(); pl[g.id]=Date.now(); savePlayed(pl); renderCounter();
   };
 }

 // Observe each detail opening.
 new MutationObserver(()=>{if(!detail.querySelector(".play-counter"))setTimeout(renderCounter,0)}).observe(detail,{childList:true,subtree:true});

 // Existing "Jugamos hoy" now increments the count once per tap.
 detail.addEventListener("click",e=>{
   const btn=e.target.closest("[data-play]");

n ${t} min`)}}\n     const xm=experienceMatch(g,x); if(x){score+=xm*3;if(xm===3)reasons.push(`encaja en ${x.toLowerCase()}`)} else score+=1;\n     if(d){const delta=Math.abs((diffRank[g.difficulty]||2)-(diffRank[d]||2));if(delta===0){score+=4;reasons.push(`dificultad ${d.toLowerCase()}`)}else if(delta===1)score+=1;}else score+=1;\n     if(!expansionIds.has(g.id))score+=1;\n     const lp=last[g.id]||0, n=counts[g.id]||0, age=lp?now-lp:Infinity;\n     if(!lp){score+=3;reasons.push("todavía no jugado")}\n     else if(age>=60*DAY){score+=2;reasons.push("hace tiempo que no sale")}\n     else if(age<7*DAY){score-=8;reasons.push("jugado recientemente")}\n     else if(age<30*DAY){score-=3;}\n     score+=Math.max(0,2-Math.min(2,n));\n     return {g,score,reasons};\n   }).filter(o=>(!x||experienceMatch(o.g,x)>0)&&(!d||Math.abs((diffRank[o.g.difficulty]||2)-(diffRank[d]||2))<=1))\n     .sort((a,b)=>b.score-a.score||((counts[a.g.id]||0)-(counts[b.g.id]||0))||minutes(a.g)-minutes(b.g)||a.g.title.localeCompare(b.g.title)).slice(0,3);\n   const box=document.querySelector("#recoResults");\n   if(!ranked.length){box.innerHTML='<div class="recoempty">No encontré una coincidencia suficientemente buena. Prueba ampliando el tiempo o dejando libre un criterio.</div>';return}\n   box.innerHTML='<div class="recolabel">Mis recomendaciones <small style="display:block;font-weight:500;margin-top:3px">Se priorizan juegos poco jugados y se penalizan los jugados en los últimos 7 días.</small></div><div class="recoresults">'+ranked.map((o,i)=>`<button class="recopick" data-id="${o.g.id}"><img src="${o.g.img}"><span><b>${i+1}. ${o.g.title}</b><small>${o.g.players} jugadores · ${o.g.duration} · ${o.g.difficulty}</small><small>${o.reasons.slice(0,3).join(" · ")||o.g.style}</small></span></button>`).join("")+'</div>';\n   box.querySelectorAll(".recopick").forEach(b=>b.onclick=()=>{document.querySelector("#reco").close();setTimeout(()=>openGame(games.find(g=>g.id===b.dataset.id)),0)});\n },true);\n})() (()=>{

<script id="final-approved-detail-v2-js">
(()=>{
  const FKEY="ludoteca-favorites-v1";
  const CKEY="ludoteca-play-count-v1";
  const PKEY="ludoteca-played-v1";
  const HKEY="ludoteca-play-history-v1";

  const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}};
  const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

  const peopleIcon=()=>`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><circle cx="16" cy="8" r="3" fill="currentColor"/><path d="M3 20c0-4 2.4-6 5-6s5 2 5 6H3Zm8 0c0-3.2 1.8-5.1 4.3-5.7C18.5 13.5 21 15.8 21 20h-10Z" fill="currentColor"/></svg>`;
  const clockIcon=()=>`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 6v6l4 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  const ageIcon=()=>`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 8h8M8 12h8M8 16h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;

  function favs(){ return read(FKEY,[]); }
  function counts(){ return read(CKEY,{}); }
  function hist(){ return read(HKEY,{}); }

  function toggleFav(id){
    let a=favs();
    a=a.includes(id)?a.filter(x=>x!==id):[...a,id];
    write(FKEY,a);
  }
  function addPlay(id){
    const c=counts(); c[id]=(c[id]||0)+1; write(CKEY,c);
    const p=read(PKEY,{}); p[id]=Date.now(); write(PKEY,p);
    const h=hist(); (h[id]||(h[id]=[])).push(Date.now()); write(HKEY,h);
  }

  function approvedOpenGame(g){
    if(!g)return;
    const detail=document.querySelector("#detail");
    const c=document.querySelector("#detailContent");
    if(!detail||!c)return;

    const isFav=favs().includes(g.id);
    const n=counts()[g.id]||0;
    const hh=hist()[g.id]||[];
    const last=hh.length?new Date(hh[hh.length-1]).toLocaleDateString("es"):null;

    c.innerHTML=`
      <div class="approved-detail">
        <section class="approved-left">
          <div class="approved-cover"><img src="${g.img}" alt="${g.title}"></div>
          <div class="approved-actions">
            <button class="approved-fav" data-approved-fav>${isFav?"♥ En favoritos":"♡ Añadir a favoritos"}</button>
            <button class="approved-play" data-approved-play>▶ Jugamos hoy</button>
          </div>
        </section>
        <section class="approved-right">
          <div class="approved-head">
            <div>
              <h2 class="approved-title">${g.title}</h2>
              <div class="approved-tag">${g.style||"Juego"}</div>
            </div>
            <button class="approved-x" type="button" aria-label="Cerrar">×</button>
          </div>

          <div class="approved-metrics">
            <div class="approved-metric players">
              ${peopleIcon()}
              <div><div class="approved-value">${g.players||"—"}</div><div class="approved-label">JUGADORES</div></div>
            </div>
            <div class="approved-metric time">
              ${clockIcon()}
              <div><div class="approved-value">${g.duration||"—"}</div><div class="approved-label">TIEMPO</div></div>
            </div>
            <div class="approved-metric age">
              ${ageIcon()}
              <div><div class="approved-value">${g.age||"—"}</div><div class="approved-label">EDAD</div></div>
            </div>
          </div>

          <div class="approved-panel">
            <h3>Descripción</h3>
            <p>${g.note||"Sin descripción disponible."}</p>
          </div>

          <div class="approved-panel">
            <h3>Mecánicas</h3>
            <p>${g.mechanics||"—"}</p>
          </div>

          <div class="approved-panel">
            <h3>Historial de partidas</h3>
            <div class="approved-history">
              <div style="font-size:26px">🎮</div>
              <div>
                <strong>${n} partida${n===1?"":"s"} registrada${n===1?"":"s"}</strong>
                <div style="color:#9caec4;margin-top:4px">${last?`Última partida: ${last}`:"Aún no hay partidas registradas de este juego."}</div>
              </div>
            </div>
          </div>

          <button class="approved-close" type="button">Cerrar</button>
        </section>
      </div>`;

    c.querySelector(".approved-x")?.addEventListener("click",()=>detail.close());
    c.querySelector(".approved-close")?.addEventListener("click",()=>detail.close());
    c.querySelector("[data-approved-fav]")?.addEventListener("click",()=>{toggleFav(g.id);approvedOpenGame(g)});
    c.querySelector("[data-approved-play]")?.addEventListener("click",()=>{addPlay(g.id);approvedOpenGame(g)});
    if(!detail.open) detail.showModal();
  }

  try{ openGame = approvedOpenGame; }catch(e){}
  window.openGame = approvedOpenGame;
})();
</script>

  <div class="v20-collection-grid" id="v20CollectionGrid"></div>
 </section>
</div>
<nav class="v20-nav">
 <button class="active" data-nav="inicio">⌂<br>Inicio</button>
 <button data-nav="collection">◈<br>Juegos</button>

 <button data-nav="stats">▥<br>Estadísticas</button>
 <button data-nav="collection">▦<br>Colección</button>
</nav>

<div class="v20-modal" id="v20PlayModal"><div class="v20-dialog">
 <div class="v20-step" id="v20StepLabel">PASO 1 DE 4</div><h2>Registrar partida</h2><div class="v20-muted" id="v20StepHelp">Seleccioná el juego que jugaste.</div>
 <div id="v20Step1" style="margin-top:16px">
  <input class="v20-search" id="v20GameSearch" placeholder="Buscar juego...">
  <div class="v20-list" id="v20GamePicker"></div>
 </div>
 <div id="v20Step2" class="v20-hidden" style="margin-top:16px">
  <div class="v20-formgrid">
   <div class="v20-field"><label>Juego</label><input id="v20SelectedGame" disabled></div>
   <div class="v20-field"><label>Fecha</label><input type="date" id="v20Date"></div>
   <div class="v20-field"><label>N.º de partidas</label><input type="number" id="v20Qty" min="1" value="1"></div>
   <div class="v20-field"><label>Lugar</label><select id="v20Location"></select></div>
  </div>
 </div>
 <div id="v20Step3" class="v20-hidden" style="margin-top:16px">
  <div class="v20-section-head"><h2 style="font-size:18px">Jugadores</h2><button class="v20-btn alt" id="v20AddPlayerRow">+ Agregar</button></div>
  <div class="v20-players" id="v20PlayerRows"></div>
  <div class="v20-mini" style="margin-top:8px">Marcá el ganador. La puntuación es opcional.</div>
 </div>
 <div id="v20Step4" class="v20-hidden" style="margin-top:16px">
  <div class="v20-field"><label>Notas (opcional)</label><textarea id="v20Notes" rows="4" placeholder="Ej.: partida muy reñida..."></textarea></div>
  <div class="v20-stat" id="v20Confirm" style="margin-top:14px"></div>
 </div>
 <div class="v20-actions2"><button class="v20-btn ghost" id="v20Back">Cancelar</button><button class="v20-btn" id="v20Next">Siguiente</button></div>
</div></div>`;
document.body.appendChild(app);

const LS_PLAYS='ludoteca-v20-plays', LS_PEOPLE='ludoteca-v20-people', LS_PLACES='ludoteca-v20-places';
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let plays=read(LS_PLAYS,[]), people=read(LS_PEOPLE,['Hugo']), places=read(LS_PLACES,['Casa','Amigos','Evento','Viaje','Café / Bar']);
let selected=null,step=1;
const EXPANSIONS=new Set(['J027','J028']);

function gameById(id){return games.find(g=>g.id===id)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function countBase(){return games.filter(g=>!EXPANSIONS.has(g.id)).length}
function countExp(){return games.filter(g=>EXPANSIONS.has(g.id)).length}
function winnerStats(){let wins=0,total=0;plays.forEach(p=>{if(p.players?.length){total++;if(p.players.some(x=>x.winner&&x.name==='Hugo'))wins++}});return {wins,total,rate:total?Math.round(wins/total*100):null}}
function refresh(){
 const counts={};plays.forEach(p=>counts[p.gameId]=(counts[p.gameId]||0)+(p.qty||1));
 const playedIds=Object.keys(counts),ws=winnerStats(),ownedCount=games.length;
 v20Owned.textContent=ownedCount;v20OwnedSub.textContent=`${countBase()} base + ${countExp()} expansiones`;
 v20PlayedGames.textContent=playedIds.length;v20Unplayed.textContent=`${Math.max(0,ownedCount-playedIds.length)} sin estrenar`;
 v20TotalPlays.textContent=plays.reduce((a,p)=>a+(p.qty||1),0);
 v20WinRate.textContent=ws.rate==null?'—':ws.rate+'%';v20WinsSub.textContent=ws.rate==null?'Sin datos aún':`${ws.wins} de ${ws.total} ganadas`;
 sTotal.textContent=v20TotalPlays.textContent;sGames.textContent=playedIds.length;sRate.textContent=v20WinRate.textContent;
 cOwned.textContent=ownedCount;cExp.textContent=countExp();cBase.textContent=countBase();
 renderRecent();renderTop(counts);renderBars();renderPeople();renderPlaces();renderCollection();
}
function renderRecent(){
 const rows=[...plays].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
 if(!rows.length){v20Recent.innerHTML='<div class="v20-row"><div class="v20-row-main"><div class="v20-row-title">Todavía no hay partidas registradas</div><div class="v20-row-meta">Usá el botón + para registrar la primera.</div></div></div>';return}
 v20Recent.innerHTML=rows.map(p=>{const g=gameById(p.gameId);return `<div class="v20-row"><img class="v20-thumb" src="${g?.img||''}"><div class="v20-row-main"><div class="v20-row-title">${escapeHtml(g?.title||'Juego')}</div><div class="v20-row-meta">${p.date} · ${escapeHtml(p.location||'—')} · ${p.players?.length||0} jugadores</div></div></div>`}).join('');
}
function renderTop(counts){
 const arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
 if(!arr.length){v20TopGames.innerHTML='<div class="v20-row"><div class="v20-row-main"><div class="v20-row-title">Sin ranking todavía</div><div class="v20-row-meta">Aparecerá cuando registres partidas.</div></div></div>';return}
 v20TopGames.innerHTML=arr.map(([id,n],i)=>{const g=gameById(id);return `<div class="v20-row"><b style="width:22px">${i+1}</b><img class="v20-thumb" src="${g?.img||''}"><div class="v20-row-main"><div class="v20-row-title">${escapeHtml(g?.title||id)}</div><div class="v20-row-meta">${n} partida${n===1?'':'s'}</div></div></div>`}).join('');
}
function renderBars(){
 const months=Array(12).fill(0);plays.forEach(p=>{const d=new Date(p.date+'T12:00:00');if(d.getFullYear()===2026)months[d.getMonth()]+=(p.qty||1)});
 const max=Math.max(...months,1),labels=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
 v20Bars.innerHTML=months.map((v,i)=>`<div class="v20-barwrap"><div class="v20-barvalue">${v||''}</div><div class="v20-bar" style="height:${Math.max(4,(v/max)*175)}px"></div><div class="v20-barlabel">${labels[i]}</div></div>`).join('');
}
function renderPeople(){
 const stats={};people.forEach(n=>stats[n]={p:0,w:0});plays.forEach(p=>(p.players||[]).forEach(x=>{if(!stats[x.name])stats[x.name]={p:0,w:0};stats[x.name].p++;if(x.winner)stats[x.name].w++}));
 v20People.innerHTML=Object.entries(stats).map(([n,s])=>`<div class="v20-row"><div class="v20-row-main"><div class="v20-row-title">${escapeHtml(n)}</div><div class="v20-row-meta">${s.p} partidas · ${s.w} victorias</div></div></div>`).join('');
}
function renderPlaces(){
 const stats={};places.forEach(n=>stats[n]=0);plays.forEach(p=>stats[p.location]=(stats[p.location]||0)+1);
 v20Places.innerHTML=Object.entries(stats).map(([n,c])=>`<div class="v20-row"><div class="v20-row-main"><div class="v20-row-title">${escapeHtml(n)}</div><div class="v20-row-meta">${c} partidas</div></div></div>`).join('');
}
function renderCollection(){
 const q=(v20Search.value||'').toLowerCase(),active=document.querySelector('#v20CollectionTabs .active')?.dataset.filter||'all';
 let arr=games.filter(g=>g.title.toLowerCase().includes(q));
 if(active==='exp')arr=arr.filter(g=>EXPANSIONS.has(g.id));
 v20CollectionGrid.innerHTML=arr.map(g=>`<div class="v20-game"><img src="${g.img}"><div style="flex:1"><div class="name">${escapeHtml(g.title)}</div><div class="meta">${escapeHtml(g.players)} · ${escapeHtml(g.duration)} · ${escapeHtml(g.age)}</div></div></div>`).join('');
}
function goto(page){
 document.body.classList.add('v20-mode');app.classList.add('active');
 document.querySelectorAll('.v20-page').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
 document.querySelectorAll('.v20-nav [data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===page));
 refresh();
}
document.querySelectorAll('[data-nav],[data-goto]').forEach(b=>b.onclick=()=>goto(b.dataset.nav||b.dataset.goto));
v20Legacy.onclick=()=>{app.classList.remove('active');document.body.classList.remove('v20-mode')};
v20Search.oninput=renderCollection;
document.querySelectorAll('#v20CollectionTabs .v20-pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('#v20CollectionTabs .v20-pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCollection()});
v20AddPlayer.onclick=()=>{const n=prompt('Nombre del jugador habitual:');if(n&&!people.includes(n)){people.push(n);write(LS_PEOPLE,people);renderPeople()}};
v20AddPlace.onclick=()=>{const n=prompt('Nombre del lugar:');if(n&&!places.includes(n)){places.push(n);write(LS_PLACES,places);renderPlaces()}};

function syncLocationOptions(){v20Location.innerHTML=places.map(p=>`<option>${escapeHtml(p)}</option>`).join('')}
function openPlay(){
 selected=null;step=1;v20PlayModal.classList.add('open');v20Date.value=new Date().toISOString().slice(0,10);
 v20PlayerRows.innerHTML='';v20Notes.value='';v20Qty.value=1;syncLocationOptions();renderPicker();showStep();
}
function renderPicker(){
 const q=(v20GameSearch.value||'').toLowerCase();const list=games.filter(g=>g.title.toLowerCase().includes(q)).slice(0,12);
 v20GamePicker.innerHTML=list.map(g=>`<button class="v20-row" style="width:100%;background:transparent;color:white;text-align:left;border:0" data-pick="${g.id}"><img class="v20-thumb" src="${g.img}"><div class="v20-row-main"><div class="v20-row-title">${escapeHtml(g.title)}</div><div class="v20-row-meta">${g.players} · ${g.duration}</div></div><div>›</div></button>`).join('');
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selected=gameById(b.dataset.pick);step=2;v20SelectedGame.value=selected.title;showStep()});
}
v20GameSearch.oninput=renderPicker;
function showStep(){
 [1,2,3,4].forEach(i=>document.querySelector('#v20Step'+i).classList.toggle('v20-hidden',i!==step));
 v20StepLabel.textContent=`PASO ${step} DE 4`;
 v20StepHelp.textContent=['Seleccioná el juego que jugaste.','Completá fecha, cantidad y lugar.','Agregá participantes y marcá el ganador.','Revisá y guardá la partida.'][step-1];
 v20Back.textContent=step===1?'Cancelar':'Atrás';v20Next.textContent=step===4?'Guardar partida':'Siguiente';
 if(step===3&&!v20PlayerRows.children.length){people.slice(0,2).forEach(addPlayerRow);if(!v20PlayerRows.children.length)addPlayerRow('Hugo')}
 if(step===4)buildConfirm();
}
function addPlayerRow(name=''){
 const row=document.createElement('div');row.className='v20-player';row.innerHTML=`<input type="text" value="${escapeHtml(name)}" placeholder="Jugador"><input type="number" placeholder="Puntos"><label class="winner"><input type="radio" name="v20Winner"> Ganador</label>`;v20PlayerRows.appendChild(row);
}
v20AddPlayerRow.onclick=()=>addPlayerRow('');
function collectPlayers(){return [...v20PlayerRows.querySelectorAll('.v20-player')].map(r=>({name:r.querySelector('input[type="text"]').value.trim(),score:r.querySelector('input[type="number"]').value||null,winner:r.querySelector('input[type="radio"]').checked})).filter(x=>x.name)}
function buildConfirm(){
 const ps=collectPlayers();v20Confirm.innerHTML=`<div class="v20-row-title">${escapeHtml(selected?.title||'')}</div><div class="v20-row-meta" style="margin-top:8px">${v20Date.value} · ${escapeHtml(v20Location.value)} · ${ps.length} jugadores</div><div class="v20-row-meta" style="margin-top:8px">${ps.map(p=>escapeHtml(p.name)+(p.winner?' 🏆':'')).join(' · ')}</div>`;
}
v20Back.onclick=()=>{if(step===1){v20PlayModal.classList.remove('open')}else{step--;showStep()}};
v20Next.onclick=()=>{
 if(step===1)return;
 if(step<4){step++;showStep();return}
 const ps=collectPlayers();if(!selected||!ps.length){alert('Seleccioná un juego y al menos un jugador.');return}
 const loc=v20Location.value;
 if(loc&&!places.includes(loc)){places.push(loc);write(LS_PLACES,places)}
 ps.forEach(p=>{if(!people.includes(p.name))people.push(p.name)});
 write(LS_PEOPLE,people);
 plays.push({id:'p'+Date.now(),gameId:selected.id,date:v20Date.value,qty:+v20Qty.value||1,location:loc,players:ps,notes:v20Notes.value});
 write(LS_PLAYS,plays);v20PlayModal.classList.remove('open');refresh();goto('inicio');
};
v20Plus.onclick=openPlay;
v20What.onclick=()=>{app.classList.remove('active');document.body.classList.remove('v20-mode');setTimeout(()=>document.querySelector('#recommend')?.click(),50)};
v20Random.onclick=()=>{app.classList.remove('active');document.body.classList.remove('v20-mode');setTimeout(()=>document.querySelector('#surprise')?.click(),50)};

// Start in V20 home.
goto('inicio');
})();
</script>

</body></html>
